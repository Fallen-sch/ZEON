[project]
name = "lion"
version = "0.1.0"
description = "Lightweight LLM Object Notation"
authors = [
    {name = "Michael Jhonathan",email = "noahsch10833@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "tiktoken (>=0.13.0,<0.14.0)"
]

[project.scripts]
lion = "lion.cli:main"

