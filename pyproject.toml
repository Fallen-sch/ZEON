[project]
name = "zeon-format"
version = "0.2.0"
description = "Zero-overhead Encoding Object Notation - A next-generation tabular serialization format designed for maximum LLM token efficiency."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["serialization", "json", "yaml", "llm", "tokens", "parser"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0.0"
]
authors = [
    {name = "Michael Jhonathan", email = "noahsch10833@gmail.com"}
]

[project.scripts]
zeon = "zeon.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "tiktoken>=0.13.0"
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zeon*"]
